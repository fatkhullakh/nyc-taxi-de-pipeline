version: 2

sources:
  - name: raw
    schema: public
    description: "Raw data loaded directly into PostgreSQL"
    tables:
      - name: nyc_taxi
        description: "NYC yellow taxi trips January 2021, cleaned and transformed via pandas"
        columns:
          - name: "VendorID"
            description: "Taxi vendor: 1=Creative Mobile, 2=VeriFone"
          - name: tpep_pickup_datetime
            description: "Trip start timestamp"
          - name: total_amount
            description: "Total fare including tips and surcharges"